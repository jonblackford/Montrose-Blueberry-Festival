<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Montrose Greenhouse — His & Herbs</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    :root { --forest:#315c32; --deep:#173219; --sage:#dfe9d8; --cream:#fffaf0; --ink:#243124; --muted:#65715f; --white:#fff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, var(--cream), var(--sage)); color: var(--ink); }
    .card { width: min(680px, 100%); background: rgba(255,255,255,.9); border: 1px solid rgba(49,92,50,.15); border-radius: 28px; padding: clamp(1.5rem, 5vw, 3rem); box-shadow: 0 22px 70px rgba(23,50,25,.14); text-align: center; }
    .mark { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1rem; display: grid; place-items: center; background: var(--forest); color: var(--white); font-size: 2rem; }
    h1 { margin: 0; color: var(--deep); font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.04em; line-height: 1.05; }
    p { color: var(--muted); font-size: 1.08rem; }
    a { display: inline-flex; margin-top: 1rem; padding: .9rem 1.15rem; background: var(--forest); color: var(--white); border-radius: 999px; text-decoration: none; font-weight: 850; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>Thank you!</h1>
    <p>Your message has been submitted. Someone from Montrose Greenhouse — His & Herbs can follow up with you soon.</p>
    <a href="../">Back to the website</a>
  </main>
</body>
</html>
