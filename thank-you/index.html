<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Montrose Greenhouse — His & Herbs</title>
  <meta name="description" content="Thank you for contacting Montrose Greenhouse — His & Herbs." />
  <meta name="theme-color" content="#315c32" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    :root {
      --forest: #315c32;
      --deep: #173219;
      --leaf: #6f9857;
      --sage: #dfe9d8;
      --cream: #fffaf0;
      --linen: #f5efe2;
      --sun: #f0b85a;
      --rose: #b65368;
      --clay: #b46a42;
      --ink: #243124;
      --muted: #65715f;
      --white: #ffffff;
      --shadow: 0 22px 70px rgba(23, 50, 25, .16);
      --radius: 24px;
      --radius-sm: 16px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.6;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 1rem;
      background: var(--deep);
      color: var(--white);
      padding: .75rem 1rem;
      border-radius: .75rem;
      z-index: 50;
    }
    .skip-link:focus { left: 1rem; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: rgba(255, 250, 240, .86);
      border-bottom: 1px solid rgba(49, 92, 50, .12);
    }
    .nav-wrap {
      width: min(var(--max), calc(100% - 2rem));
      margin: 0 auto;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .8rem;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--deep);
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--forest), var(--leaf));
      color: var(--cream);
      box-shadow: 0 8px 26px rgba(49, 92, 50, .28);
      font-size: 1.3rem;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-weight: 700;
      font-size: .76rem;
      letter-spacing: .02em;
      margin-top: -.2rem;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: .15rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--deep);
      font-weight: 700;
      font-size: .94rem;
      padding: .75rem .85rem;
      border-radius: 999px;
    }
    .nav-links a:hover { background: var(--sage); }
    .menu-btn {
      display: none;
      border: 0;
      background: var(--forest);
      color: var(--white);
      padding: .7rem .9rem;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      border: 0;
      border-radius: 999px;
      padding: .9rem 1.15rem;
      font-weight: 850;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: var(--forest);
      color: var(--white);
      box-shadow: 0 12px 28px rgba(49, 92, 50, .22);
    }
    .btn-primary:hover { background: var(--deep); }
    .btn-secondary {
      background: var(--white);
      color: var(--deep);
      border: 1px solid rgba(49, 92, 50, .18);
    }
    .btn-secondary:hover { box-shadow: 0 10px 26px rgba(23, 50, 25, .10); }

    .hero {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 15% 20%, rgba(240, 184, 90, .26), transparent 28%), linear-gradient(180deg, #fbf7ed 0%, #eef5ea 100%);
    }
    .hero-inner {
      width: min(var(--max), calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(3rem, 7vw, 6.7rem) 0 3.2rem;
      display: grid;
      grid-template-columns: 1.03fr .97fr;
      align-items: center;
      gap: clamp(2rem, 5vw, 4.5rem);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      width: fit-content;
      padding: .45rem .8rem;
      border: 1px solid rgba(49, 92, 50, .18);
      background: rgba(255, 255, 255, .72);
      border-radius: 999px;
      color: var(--forest);
      font-weight: 850;
      font-size: .84rem;
      margin-bottom: 1rem;
    }
    h1, h2, h3 { line-height: 1.05; margin: 0; color: var(--deep); letter-spacing: -.04em; }
    h1 { font-size: clamp(2.8rem, 7vw, 6.4rem); max-width: 10ch; }
    .hero-copy p {
      color: #415041;
      font-size: clamp(1.04rem, 1.8vw, 1.28rem);
      max-width: 58ch;
      margin: 1.15rem 0 1.55rem;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.25rem; }
    .quick-info {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .75rem;
      max-width: 640px;
      margin-top: 1.4rem;
    }
    .quick-card {
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(49, 92, 50, .13);
      padding: .9rem;
      border-radius: var(--radius-sm);
    }
    .quick-card strong { display: block; color: var(--deep); font-size: .92rem; }
    .quick-card span { color: var(--muted); font-size: .86rem; }
    .hero-photos {
      position: relative;
      min-height: 565px;
    }
    .photo-stack {
      position: absolute;
      border-radius: 34px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 8px solid rgba(255,255,255,.84);
      background: var(--white);
    }
    .photo-stack img { width: 100%; height: 100%; object-fit: cover; }
    .photo-main { inset: 0 0 5rem 4rem; }
    .photo-small { width: 49%; height: 52%; left: 0; bottom: 0; border-radius: 28px; }
    .floating-card {
      position: absolute;
      right: 1.2rem;
      bottom: 1.1rem;
      width: min(310px, 82%);
      padding: 1.15rem;
      border-radius: 22px;
      background: rgba(255, 250, 240, .92);
      border: 1px solid rgba(49, 92, 50, .16);
      box-shadow: 0 14px 36px rgba(23, 50, 25, .18);
      backdrop-filter: blur(10px);
    }
    .floating-card strong { color: var(--deep); display: block; font-size: 1.05rem; }
    .floating-card p { margin: .35rem 0 0; color: var(--muted); font-size: .94rem; }

    section { padding: clamp(3.5rem, 7vw, 6rem) 0; }
    .container { width: min(var(--max), calc(100% - 2rem)); margin: 0 auto; }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
      margin-bottom: 2rem;
    }
    .section-head h2 { font-size: clamp(2rem, 4vw, 3.6rem); max-width: 12ch; }
    .section-head p { margin: 0; max-width: 56ch; color: var(--muted); }

    .about-grid {
      display: grid;
      grid-template-columns: .92fr 1.08fr;
      gap: clamp(1.4rem, 4vw, 3rem);
      align-items: stretch;
    }
    .about-image {
      min-height: 500px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .about-image img { width: 100%; height: 100%; object-fit: cover; }
    .about-panel {
      background: var(--white);
      border: 1px solid rgba(49, 92, 50, .13);
      border-radius: var(--radius);
      padding: clamp(1.4rem, 4vw, 2.6rem);
      box-shadow: 0 18px 50px rgba(23, 50, 25, .08);
    }
    .about-panel h2 { font-size: clamp(2rem, 3.8vw, 3.4rem); margin-bottom: 1rem; }
    .about-panel p { color: #4b594b; margin: 0 0 1rem; }
    .feature-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
      margin-top: 1.25rem;
    }
    .feature-item {
      display: flex;
      gap: .65rem;
      align-items: flex-start;
      padding: .95rem;
      border-radius: 18px;
      background: var(--linen);
      color: var(--deep);
      font-weight: 750;
    }
    .feature-item span:first-child { color: var(--forest); }

    .services { background: var(--deep); color: var(--cream); position: relative; overflow: hidden; }
    .services::before {
      content: "";
      position: absolute;
      inset: -20% 48% auto -14%;
      height: 540px;
      background: radial-gradient(circle, rgba(111,152,87,.42), transparent 65%);
      pointer-events: none;
    }
    .services h2, .services h3 { color: var(--cream); }
    .services .section-head p { color: rgba(255,250,240,.74); }
    .services-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }
    .service-card {
      min-height: 262px;
      padding: 1.35rem;
      border-radius: var(--radius);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 40px rgba(0,0,0,.14);
    }
    .service-card .icon {
      width: 48px;
      height: 48px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: rgba(240, 184, 90, .16);
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    .service-card p { color: rgba(255,250,240,.72); margin: .8rem 0 0; }

    .season-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .9rem;
    }
    .season-card {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--white);
      border: 1px solid rgba(49, 92, 50, .12);
      box-shadow: 0 16px 40px rgba(23, 50, 25, .08);
    }
    .season-card img { height: 188px; width: 100%; object-fit: cover; }
    .season-card div { padding: 1.1rem; }
    .season-card h3 { font-size: 1.25rem; margin-bottom: .35rem; }
    .season-card p { margin: 0; color: var(--muted); font-size: .96rem; }

    .gallery { background: linear-gradient(180deg, var(--cream), #eef5ea); }
    .gallery-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr .8fr;
      grid-auto-rows: 235px;
      gap: 1rem;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      box-shadow: 0 14px 34px rgba(23, 50, 25, .10);
      background: var(--sage);
    }
    .gallery-item.large { grid-row: span 2; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s ease; }
    .gallery-item:hover img { transform: scale(1.045); }
    .gallery-caption {
      position: absolute;
      left: .8rem;
      right: .8rem;
      bottom: .8rem;
      border-radius: 16px;
      padding: .65rem .8rem;
      background: rgba(23, 50, 25, .76);
      color: var(--white);
      font-weight: 800;
      backdrop-filter: blur(8px);
      font-size: .92rem;
    }

    .visit-grid {
      display: grid;
      grid-template-columns: .88fr 1.12fr;
      gap: clamp(1rem, 4vw, 2rem);
      align-items: stretch;
    }
    .contact-card {
      background: var(--forest);
      color: var(--white);
      border-radius: var(--radius);
      padding: clamp(1.4rem, 4vw, 2.5rem);
      box-shadow: var(--shadow);
    }
    .contact-card h2 { color: var(--white); font-size: clamp(2rem, 4vw, 3.35rem); margin-bottom: .75rem; }
    .contact-card p { color: rgba(255,255,255,.78); }
    .contact-list { display: grid; gap: .75rem; margin: 1.4rem 0; }
    .contact-row {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: .75rem;
      align-items: start;
      padding: .9rem;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      border-radius: 18px;
    }
    .contact-row b { display: block; }
    .contact-row a { color: var(--white); font-weight: 750; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .map-card {
      min-height: 470px;
      border: 0;
      width: 100%;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--sage);
    }


    .contact-section {
      background: linear-gradient(180deg, #eef5ea, var(--cream));
    }
    .contact-layout {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: clamp(1rem, 4vw, 2rem);
      align-items: start;
    }
    .contact-intro {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid rgba(49, 92, 50, .12);
      box-shadow: 0 16px 40px rgba(23, 50, 25, .08);
      padding: clamp(1.4rem, 4vw, 2.35rem);
      position: sticky;
      top: 96px;
    }
    .contact-intro h2 { font-size: clamp(2rem, 4vw, 3.35rem); margin-bottom: .75rem; }
    .contact-intro p { color: var(--muted); margin: 0 0 1rem; }
    .contact-form-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid rgba(49, 92, 50, .12);
      box-shadow: var(--shadow);
      padding: clamp(1.4rem, 4vw, 2.35rem);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .field { display: grid; gap: .4rem; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      font-weight: 850;
      color: var(--deep);
      font-size: .94rem;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid rgba(49, 92, 50, .22);
      background: #fffdfa;
      border-radius: 16px;
      padding: .9rem 1rem;
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .field textarea { min-height: 160px; resize: vertical; }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--forest);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(111, 152, 87, .16);
    }
    .form-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 1rem 0 0;
    }
    .hidden-field {
      position: absolute;
      left: -9999px;
      height: 1px;
      width: 1px;
      overflow: hidden;
    }
    .thank-you-card {
      width: min(760px, calc(100% - 2rem));
      margin: clamp(4rem, 10vw, 7rem) auto;
      background: var(--white);
      border-radius: 30px;
      padding: clamp(2rem, 5vw, 4rem);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .thank-you-card h1 { max-width: none; font-size: clamp(2.4rem, 6vw, 4.6rem); }
    .thank-you-card p { color: var(--muted); font-size: 1.1rem; }

    .cta {
      padding: 0 0 clamp(3.5rem, 7vw, 6rem);
    }
    .cta-card {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: clamp(2rem, 5vw, 4rem);
      background: linear-gradient(135deg, rgba(23,50,25,.92), rgba(49,92,50,.88)), url('assets/greenhouse-mums.webp') center / cover;
      color: var(--white);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .cta-card h2 { color: var(--white); font-size: clamp(2rem, 4.2vw, 3.6rem); max-width: 14ch; }
    .cta-card p { color: rgba(255,255,255,.8); max-width: 58ch; }

    footer {
      background: var(--deep);
      color: rgba(255,250,240,.76);
      padding: 2rem 0;
    }
    .footer-inner {
      width: min(var(--max), calc(100% - 2rem));
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    footer a { color: var(--white); }

    @media (max-width: 980px) {
      .hero-inner, .about-grid, .visit-grid, .contact-layout { grid-template-columns: 1fr; }
      .hero-photos { min-height: 500px; }
      .photo-main { inset: 0 0 5.5rem 2rem; }
      .services-grid, .season-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .gallery-grid { grid-template-columns: 1fr 1fr; }
      .gallery-item.large { grid-column: span 2; grid-row: span 1; }
      .cta-card { grid-template-columns: 1fr; }
      .contact-intro { position: static; }
    }
    @media (max-width: 760px) {
      .menu-btn { display: inline-flex; }
      .nav-links {
        position: absolute;
        top: 74px;
        left: 1rem;
        right: 1rem;
        display: none;
        flex-direction: column;
        align-items: stretch;
        padding: .6rem;
        background: var(--cream);
        border: 1px solid rgba(49, 92, 50, .14);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }
      .nav-links.open { display: flex; }
      .nav-links a { border-radius: 14px; }
      .hero-inner { padding-top: 2.2rem; }
      h1 { max-width: 12ch; }
      .quick-info { grid-template-columns: 1fr; }
      .hero-photos { min-height: 430px; }
      .photo-main { inset: 0 0 4rem 0; }
      .photo-small { width: 58%; height: 46%; }
      .floating-card { right: .4rem; bottom: .25rem; }
      .section-head { display: block; }
      .section-head p { margin-top: .85rem; }
      .feature-list, .services-grid, .season-strip, .gallery-grid { grid-template-columns: 1fr; }
      .gallery-item.large { grid-column: auto; }
      .gallery-grid { grid-auto-rows: 260px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="thank-you-card">
      <span class="eyebrow">Request received</span>
      <h1>Thank you!</h1>
      <p>Your message has been submitted. Montrose Greenhouse — His & Herbs will follow up as soon as possible.</p>
      <div class="hero-actions" style="justify-content: center; margin-top: 1.5rem;">
        <a class="btn btn-primary" href="../">Back to home</a>
        <a class="btn btn-secondary" href="tel:+18106394750">Call (810) 639-4750</a>
      </div>
    </div>
  </main>
</body>
</html>
