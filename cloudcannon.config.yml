# CloudCannon configuration for Montrose Greenhouse — His & Herbs
# This keeps the site static while giving the customer a visual editor.
source: /
base_url: /

paths:
  static: /
  uploads: /assets/uploads/

collections_config:
  pages:
    name: Pages
    path: /
    output: true
    filter:
      base: none
      include:
        - index.html
        - thank-you/index.html
    _enabled_editors:
      - visual
      - content

_inputs:
  image:
    type: image
    comment: Upload greenhouse photos here. Recommended format: .webp or .jpg.
  phone:
    type: text
  email:
    type: email
  url:
    type: url
