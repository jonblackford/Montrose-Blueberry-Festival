<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedule | Montrose Blueberry Festival</title>
  <meta name="description" content="Filterable schedule for the Montrose Blueberry Festival." />
  <meta name="theme-color" content="#2f2e83" />
  <link rel="icon" href="assets/img/blueberry-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="schedule">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" data-header></header>
  <main id="main">

    <section class="page-hero compact">
      <div class="container">
        <p class="eyebrow">2026 Festival</p>
        <h1>Schedule of Events</h1>
        <p class="lead">Filter by day, event type, or keyword. Event details live in one editable data file.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="toolbar schedule-toolbar">
          <label>Search events <input type="search" data-event-search placeholder="Search parade, food, location..." /></label>
          <label>Day <select data-event-day><option value="all">All days</option></select></label>
          <label>Category <select data-event-category><option value="all">All categories</option></select></label>
        </div>
        <div class="notice" data-schedule-note></div>
        <div class="schedule-list" data-schedule></div>
      </div>
    </section>

  </main>
  <footer class="site-footer" data-footer></footer>
  <script src="assets/js/main.js"></script>
  
</body>
</html>
